[package]
name = "silver-gpu"
version = "2.5.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gpu", "cuda", "acceleration", "mining"]
categories = ["hardware-support"]
description = "GPU acceleration for SilverBitcoin mining and computation"

[dependencies]
silver-core = { path = "../silver-core" }
silver-pow = { path = "../silver-pow" }

tokio = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

tracing = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }

parking_lot = { workspace = true }
dashmap = { workspace = true }

chrono = { workspace = true }

# Cryptography
sha2 = { workspace = true }

# CPU utilities
num_cpus = "1.16"

# Mining dependencies
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# GPU libraries (optional features)
ocl = { version = "0.19", optional = true }
cudarc = { version = "0.12", optional = true }

[features]
default = ["opencl"]
opencl = ["ocl"]
cuda = ["cudarc"]
all-gpu = ["opencl", "cuda"]

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "gpu_benchmarks"
harness = false

[[bin]]
name = "gpu_miner_real"
path = "src/bin/gpu_miner_real.rs"
