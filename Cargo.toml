[package]
name = "silver-gpu"
version = "2.5.4"
edition = "2021"
rust-version = "1.90"
authors = ["SilverBitcoin Team <team@silverbitcoin.org>"]
license = "Apache-2.0"
repository = "https://github.com/silverbitcoin/silverbitcoin"
homepage = "https://silverbitcoin.org"
keywords = ["gpu", "cuda", "acceleration", "mining"]
categories = ["hardware-support"]
description = "GPU acceleration for SilverBitcoin mining and computation"

[dependencies]
silver-core = { path = "../silver-core" }
silver-pow = { path = "../silver-pow" }

tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
bytes = "1.5"
hex = "0.4"

parking_lot = "0.12"
dashmap = "5.5"

chrono = { version = "0.4", features = ["serde"] }

# Cryptography (512-bit only)
sha2 = "0.10"

# CPU utilities
num_cpus = "1.16"

# Mining dependencies
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }

# GPU libraries (optional features)
ocl = { version = "0.19", optional = true }
cudarc = { version = "0.12", optional = true }

[features]
default = []
opencl = ["ocl"]
cuda = ["cudarc"]
all-gpu = ["opencl", "cuda"]

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "gpu_benchmarks"
harness = false

[[bin]]
name = "gpu-miner"
path = "src/bin/gpu_miner_real.rs"
